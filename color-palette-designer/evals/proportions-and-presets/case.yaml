schema_version: "1.1"
name: proportions-and-presets
expected_outcome: |
  Picks the calm 70-25-5 area preset (or states an equivalent restrained split with the accent at about 3-7 percent), validates it with the ratio command, generates hover/active/disabled/tint CSS with the states command so the hover and active percentages are solved for a visible lightness step with on-primary still at 4.5:1 or higher, and labels the area percentages as convention rather than research.
